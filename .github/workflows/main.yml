name: Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE: gfll.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: Win32

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        working-directory: ${{ github.workspace }}
        run: >
          msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}
          ${{ env.SOLUTION_FILE }}

      - name: Locate build output
        id: find_output
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Recurse -Filter "msidcrl40.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "Could not find built msidcrl40.dll"
            exit 1
          }
          echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfll-${{ env.BUILD_CONFIGURATION }}-${{ env.BUILD_PLATFORM }}
          path: ${{ steps.find_output.outputs.dll_path }}
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_output.outputs.dll_path }}
